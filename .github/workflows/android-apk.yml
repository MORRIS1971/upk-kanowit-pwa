name: Build UPK Android APK

on:
  push:
    branches: ["upk-v2-staging"]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        run: |
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platforms/android-34"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt"

      - name: Validate Android configuration
        run: |
          grep -Fq "applicationId 'my.gov.moe.upkkanowit'" app/build.gradle
          grep -Fq 'minSdk 21' app/build.gradle
          grep -Fq 'targetSdk 34' app/build.gradle
          grep -Fq 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -F "package: name='my.gov.moe.upkkanowit'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UPK-V2-Android-debug
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
