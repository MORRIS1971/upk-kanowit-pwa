name: Validate UPK Kanowit PWA staging

on:
  push:
    branches: ["upk-v2-staging"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "upk-pwa-staging-validation"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript, manifest and app shell
        run: |
          node --check config.js
          node --check sw.js
          python3 -m json.tool manifest.webmanifest > /dev/null
          test -f index.html
          test -f icons/icon-192.svg
          test -f icons/icon-512.svg
          grep -q 'rel="manifest"' index.html
          grep -q "serviceWorker.register" index.html
          grep -q 'appsScriptUrl: ""' config.js
      - name: Validate inline launcher JavaScript and SVG assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          html = Path("index.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("Launcher script not found")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/upk-launcher.js").write_text(script, encoding="utf-8")
          for icon in ["icons/icon-192.svg", "icons/icon-512.svg"]:
              ET.parse(icon)
          PY
          node --check /tmp/upk-launcher.js
      - name: Validate staging security boundary
        run: |
          ! grep -Eiq 'UPK_ADMIN_PIN|UPK_ADMIN_PIN_SHA256|UPK_TEST_SPREADSHEET_ID' config.js
          grep -q 'V2 staging' V2-INTEGRATION.md
          test "${GITHUB_REF_NAME}" = "upk-v2-staging"
      - name: Report
        run: echo "UPK V2 staging source validation passed."
